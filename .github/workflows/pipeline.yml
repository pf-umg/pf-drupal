# .github/workflows/pipeline.yml
# Version 4: la deja Jairo. El siguiente reemplaza este archivo completo por su version.
name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    uses: ./.github/workflows/sast.yml

  sca:
    uses: ./.github/workflows/sca.yml

  contenedor-iac:
    uses: ./.github/workflows/contenedor-iac.yml

  dast:
    uses: ./.github/workflows/dast.yml
