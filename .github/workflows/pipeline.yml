# .github/workflows/pipeline.yml
# Version 2: la deja Josue. El siguiente reemplaza este archivo completo por su version.
name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    uses: ./.github/workflows/sast.yml

  dast:
    uses: ./.github/workflows/dast.yml
