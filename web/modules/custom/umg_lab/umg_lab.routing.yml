umg_lab.buscar:
  path: '/lab/buscar'
  defaults: { _controller: '\Drupal\umg_lab\Controller\LabController::buscar' }
  requirements:
    _permission: 'access content'

umg_lab.borrar:
  path: '/lab/borrar/{nid}'
  defaults: { _controller: '\Drupal\umg_lab\Controller\LabController::borrar' }
  methods: [POST]
  requirements:
    _permission: 'administer nodes'
    _csrf_token: 'TRUE'
    nid: '\d+'
